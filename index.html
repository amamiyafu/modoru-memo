<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8cfc8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="戻るメモ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ぶれた時に戻るメモ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.png">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    .app {
      width: 100%;
      max-width: 100%;
      min-height: 100%;
      overflow-x: hidden;
    }

    html {
      background: #fbf5f2;
      color: #4d3f3a;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, #f8ece7 0%, #fbf5f2 42%, #fffaf7 100%);
      font-size: 16px;
      line-height: 1.8;
    }

    button,
    textarea,
    input {
      width: 100%;
      max-width: 100%;
      font: inherit;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 18px;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(22px + env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom));
    }

    .shell {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .header {
      padding: 10px 2px 18px;
      text-align: center;
    }

    h1 {
      max-width: 19rem;
      margin: 0 auto 16px;
      color: #473832;
      font-size: 27px;
      line-height: 1.35;
      font-weight: 700;
      letter-spacing: 0;
    }

    .lead {
      max-width: 28rem;
      margin: 0 auto;
      color: #75645e;
      font-size: 16px;
      line-height: 2.08;
      text-align: center;
      white-space: pre-line;
    }

    .composer {
      margin-top: 20px;
      padding: 18px;
      background: rgba(255, 252, 249, 0.88);
      border: 1px solid rgba(214, 184, 174, 0.55);
      border-radius: 24px;
      box-shadow: 0 14px 34px rgba(106, 75, 65, 0.08);
    }

    textarea {
      min-height: 86px;
      max-height: 24vh;
      resize: vertical;
      padding: 16px;
      color: #4a3c36;
      background: #fffaf7;
      border: 1px solid #dec7bf;
      line-height: 1.8;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    textarea::placeholder {
      color: #a6958f;
    }

    textarea:focus {
      border-color: #cfa89c;
      box-shadow: 0 0 0 4px rgba(207, 168, 156, 0.18);
    }

    .save-button {
      min-height: 52px;
      margin-top: 14px;
      padding: 14px 18px;
      color: #fffaf7;
      background: #b98479;
      font-weight: 700;
      line-height: 1.35;
      box-shadow: 0 10px 22px rgba(153, 95, 83, 0.18);
    }

    .save-button:active {
      transform: translateY(1px);
      background: #aa766c;
    }

    .status {
      min-height: 26px;
      margin-top: 10px;
      color: #8f746c;
      font-size: 15px;
      line-height: 1.7;
      text-align: center;
    }

    .list-section {
      margin-top: 24px;
    }

    .swipe-note {
      margin: 0 4px 12px;
      color: #b1a19c;
      font-size: 13px;
      line-height: 1.6;
    }

    .empty {
      max-width: 30rem;
      margin: 0 auto;
      padding: 24px 18px;
      color: #806d67;
      background: rgba(255, 252, 249, 0.72);
      border: 1px solid rgba(219, 193, 184, 0.58);
      border-radius: 22px;
      line-height: 2;
      text-align: center;
    }

    .memo-list {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .memo-row {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #c67870;
    }

    .delete-button {
      position: absolute;
      inset: 0 0 0 auto;
      width: 92px;
      min-height: 100%;
      padding: 0 14px;
      color: #fff;
      background: #c67870;
      border-radius: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }

    .memo-card {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 72px;
      padding: 18px 18px 19px;
      color: #4a3d38;
      background: rgba(255, 252, 249, 0.96);
      border: 1px solid rgba(218, 194, 186, 0.68);
      border-radius: 22px;
      box-shadow: 0 12px 28px rgba(104, 76, 69, 0.08);
      font-size: 17px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-break: break-word;
      transition: transform 180ms ease;
      touch-action: pan-y;
    }

    .memo-row.is-open .memo-card {
      transform: translateX(-92px);
    }

    .backup {
      margin-top: 14px;
      padding: 14px;
      background: rgba(255, 250, 247, 0.58);
      border: 1px solid rgba(218, 194, 186, 0.42);
      border-radius: 18px;
      text-align: center;
    }

    .backup h2 {
      max-width: 18rem;
      margin: 0 auto 6px;
      color: #665650;
      font-size: 16px;
      line-height: 1.45;
      letter-spacing: 0;
    }

    .backup p {
      max-width: 25rem;
      margin: 0 auto 10px;
      color: #95847e;
      font-size: 14px;
      line-height: 1.85;
      text-align: center;
      white-space: pre-line;
    }

    .backup-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .backup-button {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      height: 46px;
      min-height: 46px;
      margin: 0;
      padding: 11px 14px;
      color: #fffaf7;
      background: #b59a91;
      border: 0;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 8px 16px rgba(107, 82, 73, 0.09);
    }

    .backup-button:active {
      transform: translateY(1px);
      background: #a98d84;
    }

    .backup-button.secondary {
      color: #7c675f;
      background: #f4e8e3;
      box-shadow: none;
    }

    .file-input {
      display: none;
    }

    @media (min-width: 620px) {
      .app {
        padding-right: 24px;
        padding-left: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <header class="header">
        <h1>ぶれた時に戻るメモ</h1>
        <p class="lead">しんどい時の自分に、
自分の軸を思い出してもらえるように。

書けるときに、書きたいことだけ残してください。
迷った日は、読むだけでも大丈夫です。</p>
      </header>

      <section class="composer" aria-label="メモを書く">
        <textarea id="memoInput" placeholder="今の自分が、未来の自分に残したい言葉を書く" rows="3"></textarea>
        <button class="save-button" id="saveButton" type="button">保存する</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>

      <section class="backup" aria-label="バックアップ">
        <h2>バックアップ</h2>
        <p>記録を保存・復元できます。

大切な記録がなくならないように、
定期的に保存をお願いします。</p>
        <div class="backup-actions">
          <button class="backup-button" id="backupSaveButton" type="button">保存</button>
          <label class="backup-button restore-button" for="importFile">復元</label>
        </div>
        <input class="file-input" id="importFile" type="file" accept="application/json,.json">
      </section>

      <section class="list-section" aria-label="保存したメモ">
        <p class="swipe-note">スライドすると削除できます</p>
        <div id="memoArea"></div>
      </section>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "bureta_toki_ni_modoru_memo_v1";
    const memoInput = document.getElementById("memoInput");
    const saveButton = document.getElementById("saveButton");
    const status = document.getElementById("status");
    const memoArea = document.getElementById("memoArea");
    const backupSaveButton = document.getElementById("backupSaveButton");
    const importFile = document.getElementById("importFile");
    let statusTimer = null;

    function loadMemos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return [];
        }
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) {
          return [];
        }
        return parsed.filter((memo) => typeof memo === "string");
      } catch (error) {
        return [];
      }
    }

    function saveMemos(memos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
    }

    function normalizeMemo(text) {
      const trimmed = text.trim();
      if (!trimmed) {
        return "";
      }
      return trimmed.startsWith("・") ? trimmed : "・" + trimmed;
    }

    function showStatus(message) {
      status.textContent = message;
      window.clearTimeout(statusTimer);
      statusTimer = window.setTimeout(() => {
        status.textContent = "";
      }, 1800);
    }

    function closeAllRows() {
      document.querySelectorAll(".memo-row.is-open").forEach((row) => {
        row.classList.remove("is-open");
      });
    }

    function renderMemos() {
      const memos = loadMemos();
      memoArea.textContent = "";

      if (memos.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "まだメモはありません。";
        memoArea.appendChild(empty);
        return;
      }

      const list = document.createElement("ul");
      list.className = "memo-list";

      memos.forEach((memo, index) => {
        const row = document.createElement("li");
        row.className = "memo-row";

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "削除";
        deleteButton.addEventListener("click", () => deleteMemo(index));

        const card = document.createElement("div");
        card.className = "memo-card";
        card.textContent = memo;

        addSwipeBehavior(row, card);
        row.appendChild(deleteButton);
        row.appendChild(card);
        list.appendChild(row);
      });

      memoArea.appendChild(list);
    }

    function addSwipeBehavior(row, card) {
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let dragging = false;
      let suppressClick = false;

      card.addEventListener("pointerdown", (event) => {
        startX = event.clientX;
        startY = event.clientY;
        currentX = 0;
        dragging = true;
      });

      card.addEventListener("pointermove", (event) => {
        if (!dragging) {
          return;
        }

        const diffX = event.clientX - startX;
        const diffY = event.clientY - startY;

        if (Math.abs(diffY) > Math.abs(diffX) && Math.abs(diffY) > 12) {
          dragging = false;
          card.style.transform = "";
          return;
        }

        if (diffX < 0) {
          currentX = Math.max(diffX, -92);
          card.style.transform = "translateX(" + currentX + "px)";
        }
      });

      card.addEventListener("pointerup", () => {
        if (!dragging) {
          return;
        }
        dragging = false;
        card.style.transform = "";
        if (currentX < -42) {
          closeAllRows();
          row.classList.add("is-open");
          suppressClick = true;
        } else {
          row.classList.remove("is-open");
        }
      });

      card.addEventListener("pointercancel", () => {
        dragging = false;
        card.style.transform = "";
      });

      card.addEventListener("click", () => {
        if (suppressClick) {
          suppressClick = false;
          return;
        }
        if (row.classList.contains("is-open")) {
          row.classList.remove("is-open");
        }
      });
    }

    function addMemo() {
      const memo = normalizeMemo(memoInput.value);
      if (!memo) {
        return;
      }

      const memos = loadMemos();
      memos.unshift(memo);
      saveMemos(memos);
      memoInput.value = "";
      renderMemos();
      showStatus("保存しました");
    }

    function deleteMemo(index) {
      if (!window.confirm("このメモを削除しますか？")) {
        closeAllRows();
        return;
      }

      const memos = loadMemos();
      memos.splice(index, 1);
      saveMemos(memos);
      renderMemos();
    }

    function saveBackup() {
      const data = {
        app: "ぶれた時に戻るメモ",
        storageKey: STORAGE_KEY,
        version: 1,
        exportedAt: new Date().toISOString(),
        memos: loadMemos()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const date = new Date().toISOString().slice(0, 10);
      link.href = url;
      link.download = "modoru-memo-backup-" + date + ".json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showStatus("データを保存しました");
    }

    function restoreBackup(file) {
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          const memos = Array.isArray(parsed) ? parsed : parsed.memos;

          if (!Array.isArray(memos) || !memos.every((memo) => typeof memo === "string")) {
            window.alert("復元できるファイルではありません。");
            return;
          }

          if (!window.confirm("復元しますか？今のメモは、選んだファイルの内容に置き換わります。")) {
            return;
          }

          saveMemos(memos);
          renderMemos();
          showStatus("データを復元しました");
        } catch (error) {
          window.alert("復元できませんでした。");
        } finally {
          importFile.value = "";
        }
      });
      reader.readAsText(file);
    }

    saveButton.addEventListener("click", addMemo);
    backupSaveButton.addEventListener("click", saveBackup);
    importFile.addEventListener("change", () => {
      const file = importFile.files && importFile.files[0];
      if (file) {
        restoreBackup(file);
      }
    });

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".memo-row")) {
        closeAllRows();
      }
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    renderMemos();
  </script>
</body>
</html>
