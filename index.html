<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8cfc5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="戻るメモ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <title>ぶれた時に戻るメモ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    .app {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      overflow-x: hidden;
    }

    html {
      min-height: 100%;
      background: #f8efeb;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      color: #4c3c37;
      background:
        radial-gradient(circle at top left, rgba(255, 248, 242, 0.96), rgba(255, 248, 242, 0) 28rem),
        linear-gradient(180deg, #f8efeb 0%, #f4e5df 54%, #faf3ef 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-size: 16px;
      line-height: 1.8;
    }

    button,
    textarea,
    input {
      width: 100%;
      max-width: 100%;
      font: inherit;
      font-size: 16px;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 18px;
    }

    button {
      min-height: 52px;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    .app {
      min-height: 100svh;
      padding: max(18px, env(safe-area-inset-top)) 17px max(28px, env(safe-area-inset-bottom));
    }

    .shell {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .hero {
      padding: 12px 2px 20px;
    }

    h1 {
      color: #5b413a;
      font-size: 29px;
      line-height: 1.36;
      font-weight: 760;
      letter-spacing: 0;
    }

    .lead {
      margin-top: 16px;
      color: #76615a;
      font-size: 16px;
      line-height: 2;
      white-space: pre-line;
    }

    .composer,
    .backup,
    .empty,
    .closing {
      border: 1px solid rgba(174, 126, 112, 0.18);
      background: rgba(255, 252, 249, 0.82);
      box-shadow: 0 16px 34px rgba(118, 82, 70, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .composer {
      padding: 15px;
      border-radius: 24px;
    }

    textarea {
      display: block;
      height: 138px;
      min-height: 118px;
      max-height: 38svh;
      padding: 16px 15px;
      color: #4c3c37;
      background: #fffaf7;
      border: 1px solid #ead5cb;
      line-height: 1.75;
      resize: vertical;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    textarea::placeholder {
      color: #aa8d84;
    }

    textarea:focus {
      border-color: #d7ab9c;
      box-shadow: 0 0 0 4px rgba(216, 173, 157, 0.17);
    }

    .primary-button {
      margin-top: 13px;
      padding: 14px 18px;
      color: #fffaf7;
      background: #a96f61;
      font-weight: 720;
      line-height: 1.4;
      box-shadow: 0 10px 22px rgba(135, 83, 71, 0.19);
    }

    .primary-button:active {
      transform: translateY(1px);
      background: #965d51;
    }

    .status {
      min-height: 28px;
      padding-top: 9px;
      color: #8a645a;
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
    }

    .list-note {
      margin: 18px 2px 9px;
      color: #9b918e;
      font-size: 13px;
      line-height: 1.5;
    }

    .notes {
      display: grid;
      gap: 12px;
    }

    .note-card {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #b96b61;
      touch-action: pan-y;
    }

    .note-delete {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 1;
      width: 90px;
      height: 100%;
      min-height: 100%;
      border-radius: 0;
      color: #fff;
      background: #b75a50;
      font-weight: 720;
      line-height: 1.4;
    }

    .note-body {
      position: relative;
      z-index: 2;
      min-height: 84px;
      padding: 18px 17px;
      color: #4d3b36;
      background: rgba(255, 253, 250, 0.96);
      border: 1px solid rgba(174, 126, 112, 0.2);
      border-radius: 22px;
      font-size: 17px;
      line-height: 2;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      transform: translateX(0);
      transition: transform 180ms ease;
      box-shadow: 0 12px 26px rgba(118, 82, 70, 0.08);
    }

    .note-card.is-open .note-body {
      transform: translateX(-90px);
    }

    .empty {
      margin-top: 18px;
      padding: 24px 18px;
      border-radius: 22px;
      color: #806961;
      font-size: 16px;
      line-height: 1.95;
      text-align: center;
      white-space: pre-line;
    }

    .backup {
      margin-top: 26px;
      padding: 18px 16px;
      border-radius: 24px;
    }

    h2 {
      color: #5b413a;
      font-size: 20px;
      line-height: 1.45;
      font-weight: 750;
      letter-spacing: 0;
    }

    .backup p {
      margin-top: 10px;
      color: #7a625a;
      font-size: 15px;
      line-height: 1.85;
    }

    .backup-actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .secondary-button {
      padding: 13px 16px;
      color: #694c44;
      background: #fff8f4;
      border: 1px solid #ead3c9;
      font-weight: 720;
      line-height: 1.4;
    }

    .secondary-button:active {
      transform: translateY(1px);
      background: #f8e9e2;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .closing {
      margin-top: 24px;
      padding: 20px 17px;
      border-radius: 22px;
      color: #7c625b;
      font-size: 14px;
      line-height: 2;
      text-align: center;
      white-space: pre-line;
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 520px) {
      .app {
        padding-right: 24px;
        padding-left: 24px;
      }

      h1 {
        font-size: 34px;
      }

      .backup-actions {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <header class="hero">
        <h1>ぶれた時に戻るメモ</h1>
        <p class="lead">しんどい時の自分に、
自分の軸を思い出してもらえるように。

書けるときに、書きたいことだけ残してください。
迷った日は、読むだけでも大丈夫です。</p>
      </header>

      <section class="composer" aria-label="メモを書く">
        <textarea id="memoInput" placeholder="今の自分が、未来の自分に残したい言葉を書く" aria-label="未来の自分に残したい言葉"></textarea>
        <button class="primary-button" id="saveButton" type="button">保存する</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
      </section>

      <p class="list-note" id="listNote">スライドすると削除できます</p>
      <section class="notes" id="notes" aria-label="保存したメモ"></section>
      <div class="empty" id="empty">まだメモはありません。
書けるときに、ひとつだけ残せば大丈夫です。</div>

      <section class="backup" aria-label="バックアップ">
        <h2>バックアップ</h2>
        <p>大切な言葉がなくならないように、定期的なバックアップをお願いします。</p>
        <div class="backup-actions">
          <button class="secondary-button" id="exportButton" type="button">バックアップを書き出す</button>
          <button class="secondary-button" id="importButton" type="button">バックアップを読み込む</button>
        </div>
        <input class="file-input" id="importFile" type="file" accept="application/json,.json" aria-label="バックアップファイルを選択">
      </section>

      <p class="closing">迷っている今のわたしも、
ここに書いたわたしも、
どちらも本当です。

だから、責めなくていい。
何度でも、戻ってきて大丈夫です。</p>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      var STORAGE_KEY = "bureta_toki_ni_modoru_memo_notes_v1";
      var notes = [];
      var statusTimer = null;

      var memoInput = document.getElementById("memoInput");
      var saveButton = document.getElementById("saveButton");
      var notesList = document.getElementById("notes");
      var empty = document.getElementById("empty");
      var listNote = document.getElementById("listNote");
      var status = document.getElementById("status");
      var exportButton = document.getElementById("exportButton");
      var importButton = document.getElementById("importButton");
      var importFile = document.getElementById("importFile");

      function readNotes() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          var parsed = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(parsed)) {
            return [];
          }

          return parsed
            .filter(function (item) {
              return item && typeof item.text === "string" && item.text.trim();
            })
            .map(function (item) {
              return {
                id: typeof item.id === "string" ? item.id : String(Date.now() + Math.random()),
                text: item.text
              };
            });
        } catch (error) {
          return [];
        }
      }

      function saveNotes() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
      }

      function normalizeMemoText(value) {
        var text = value.trim();
        if (!text) {
          return "";
        }
        return text.indexOf("・") === 0 ? text : "・" + text;
      }

      function showStatus(message) {
        status.textContent = message;
        if (statusTimer) {
          clearTimeout(statusTimer);
        }
        statusTimer = setTimeout(function () {
          status.textContent = "";
        }, 2200);
      }

      function closeOpenCards(exceptCard) {
        var openCards = notesList.querySelectorAll(".note-card.is-open");
        openCards.forEach(function (card) {
          if (card !== exceptCard) {
            card.classList.remove("is-open");
          }
        });
      }

      function makeNoteCard(note) {
        var card = document.createElement("article");
        card.className = "note-card";

        var deleteButton = document.createElement("button");
        deleteButton.className = "note-delete";
        deleteButton.type = "button";
        deleteButton.textContent = "削除";
        deleteButton.setAttribute("aria-label", "このメモを削除");

        var body = document.createElement("div");
        body.className = "note-body";
        body.textContent = note.text;

        var startX = 0;
        var startY = 0;
        var tracking = false;

        body.addEventListener("touchstart", function (event) {
          if (!event.touches || event.touches.length !== 1) {
            return;
          }
          startX = event.touches[0].clientX;
          startY = event.touches[0].clientY;
          tracking = true;
        }, { passive: true });

        body.addEventListener("touchmove", function (event) {
          if (!tracking || !event.touches || event.touches.length !== 1) {
            return;
          }
          var diffX = event.touches[0].clientX - startX;
          var diffY = event.touches[0].clientY - startY;
          if (Math.abs(diffY) > Math.abs(diffX)) {
            return;
          }
          if (diffX < -32) {
            closeOpenCards(card);
            card.classList.add("is-open");
          }
          if (diffX > 32) {
            card.classList.remove("is-open");
          }
        }, { passive: true });

        body.addEventListener("touchend", function () {
          tracking = false;
        }, { passive: true });

        body.addEventListener("click", function () {
          if (card.classList.contains("is-open")) {
            card.classList.remove("is-open");
          }
        });

        deleteButton.addEventListener("click", function () {
          if (!confirm("このメモを削除しますか？")) {
            return;
          }
          notes = notes.filter(function (item) {
            return item.id !== note.id;
          });
          saveNotes();
          renderNotes();
          showStatus("削除しました");
        });

        card.appendChild(deleteButton);
        card.appendChild(body);
        return card;
      }

      function renderNotes() {
        notesList.textContent = "";
        empty.hidden = notes.length > 0;
        listNote.hidden = notes.length === 0;
        notes.forEach(function (note) {
          notesList.appendChild(makeNoteCard(note));
        });
      }

      function addNote() {
        var text = normalizeMemoText(memoInput.value);
        if (!text) {
          return;
        }
        notes.unshift({
          id: String(Date.now()) + "-" + Math.random().toString(36).slice(2),
          text: text
        });
        saveNotes();
        memoInput.value = "";
        renderNotes();
        showStatus("保存しました");
      }

      function exportBackup() {
        var backup = {
          app: "ぶれた時に戻るメモ",
          storageKey: STORAGE_KEY,
          exportedAt: new Date().toISOString(),
          notes: notes
        };
        var blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        var date = new Date().toISOString().slice(0, 10);
        link.href = url;
        link.download = "modoru-memo-backup-" + date + ".json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        showStatus("バックアップを書き出しました");
      }

      function normalizeImportedNotes(parsed) {
        var imported = Array.isArray(parsed) ? parsed : parsed && parsed.notes;
        if (!Array.isArray(imported)) {
          return null;
        }
        return imported
          .filter(function (item) {
            return item && typeof item.text === "string" && item.text.trim();
          })
          .map(function (item) {
            return {
              id: typeof item.id === "string" ? item.id : String(Date.now() + Math.random()),
              text: normalizeMemoText(item.text)
            };
          });
      }

      function importBackup(file) {
        if (!file) {
          return;
        }

        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(String(reader.result || ""));
            var importedNotes = normalizeImportedNotes(parsed);
            if (!importedNotes) {
              alert("読み込めるバックアップではありません。");
              return;
            }
            if (!confirm("今のメモをバックアップの内容で復元しますか？")) {
              return;
            }
            notes = importedNotes;
            saveNotes();
            renderNotes();
            showStatus("復元しました");
          } catch (error) {
            alert("バックアップを読み込めませんでした。");
          } finally {
            importFile.value = "";
          }
        };
        reader.readAsText(file);
      }

      saveButton.addEventListener("click", addNote);
      exportButton.addEventListener("click", exportBackup);
      importButton.addEventListener("click", function () {
        importFile.click();
      });
      importFile.addEventListener("change", function () {
        importBackup(importFile.files && importFile.files[0]);
      });

      document.addEventListener("click", function (event) {
        if (!event.target.closest(".note-card")) {
          closeOpenCards(null);
        }
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js");
        });
      }

      notes = readNotes();
      renderNotes();
    }());
  </script>
</body>
</html>
